name: Cloudflare Workers

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      migrate_d1:
        description: Import the preserved D1 export before first deployment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-radar-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install

      - name: Apply Neon migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0001_postgres.sql

      - name: Export D1 and import verified snapshot
        if: inputs.migrate_d1 == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          D1_DUMP="$(mktemp)"
          D1_SNAPSHOT="$(mktemp)"
          D1_LOG="$(mktemp)"
          trap 'rm -f "$D1_DUMP" "$D1_SNAPSHOT" "$D1_LOG"' EXIT
          if ! npx wrangler d1 export e7227c0d-0652-4fc8-bc8d-c3f9cd3dee10 --remote --output "$D1_DUMP" >"$D1_LOG" 2>&1; then
            echo "D1 export failed; see Wrangler exit status without exposing export details" >&2
            exit 1
          fi
          python3 scripts/d1-export-to-json.py "$D1_DUMP" "$D1_SNAPSHOT"
          node scripts/import-d1-snapshot.mjs "$D1_SNAPSHOT"

      - name: Require verified data before deployment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/verify-neon-import.mjs

      - name: Calendar data diagnostics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "
            SELECT json_build_object(
              'followed_shows', (SELECT COUNT(*) FROM followed_shows),
              'future_episode_rows', (SELECT COUNT(*) FROM episodes WHERE airdate >= to_char(CURRENT_DATE, 'YYYY-MM-DD')),
              'series_calendar_events', (
                SELECT COUNT(*)
                FROM episodes e
                JOIN followed_shows f ON f.show_id = e.show_id
                WHERE e.airdate >= to_char(CURRENT_DATE, 'YYYY-MM-DD')
                  AND e.airdate <= to_char(CURRENT_DATE + 730, 'YYYY-MM-DD')
              ),
              'series_calendar_first_date', (
                SELECT MIN(e.airdate)
                FROM episodes e
                JOIN followed_shows f ON f.show_id = e.show_id
                WHERE e.airdate >= to_char(CURRENT_DATE, 'YYYY-MM-DD')
              ),
              'series_calendar_last_date', (
                SELECT MAX(e.airdate)
                FROM episodes e
                JOIN followed_shows f ON f.show_id = e.show_id
                WHERE e.airdate >= to_char(CURRENT_DATE, 'YYYY-MM-DD')
              ),
              'episodes_last_sync', (SELECT value FROM sync_state WHERE key = 'episodes_last_sync'),
              'episodes_known_future', (SELECT value FROM sync_state WHERE key = 'episodes_known_future')
            );
          "

      - name: Configure Worker database secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Sync application secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
          CALENDAR_TOKEN: ${{ secrets.CALENDAR_TOKEN }}
        run: |
          if [ -n "$TMDB_BEARER_TOKEN" ]; then
            printf '%s' "$TMDB_BEARER_TOKEN" | npx wrangler secret put TMDB_BEARER_TOKEN
          fi

          if [ -n "$CALENDAR_TOKEN" ]; then
            printf '%s' "$CALENDAR_TOKEN" | npx wrangler secret put CALENDAR_TOKEN
          elif npx wrangler secret list --format json | grep -q '"CALENDAR_TOKEN"'; then
            echo "CALENDAR_TOKEN already exists in Cloudflare; keeping the stable value."
          else
            GENERATED_CALENDAR_TOKEN="$(openssl rand -hex 32)"
            printf '%s' "$GENERATED_CALENDAR_TOKEN" | npx wrangler secret put CALENDAR_TOKEN
            unset GENERATED_CALENDAR_TOKEN
            echo "Generated CALENDAR_TOKEN once in Cloudflare. It can be revealed only through the Access-protected calendar manager."
          fi

      - name: Attach radar.pkubelka.cz custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail-with-body --show-error --silent \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -X PUT \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"hostname":"radar.pkubelka.cz","service":"release-radar","zone_name":"pkubelka.cz"}'

      - name: Configure Cloudflare Access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: 0fcca39cc6516b8e23971bd717c0e9ca
          ACCESS_ALLOWED_EMAIL: ksonny4@gmail.com
        run: node scripts/provision-cloudflare-access.mjs

      - name: Verify Access boundaries
        run: |
          HEADERS="$(mktemp)"
          trap 'rm -f "$HEADERS"' EXIT

          ROOT_STATUS="$(curl --silent --show-error --dump-header "$HEADERS" --output /dev/null --max-redirs 0 --write-out '%{http_code}' https://radar.pkubelka.cz/)"
          if [ "$ROOT_STATUS" != "302" ] || ! grep -qi '/cdn-cgi/access/login/' "$HEADERS"; then
            echo "Expected homepage to redirect to Cloudflare Access login; got HTTP ${ROOT_STATUS}" >&2
            sed -n '1,20p' "$HEADERS" >&2
            exit 1
          fi

          curl --fail --show-error --silent --retry 10 --retry-delay 6 https://radar.pkubelka.cz/healthz

          for FEED in series movies; do
            STATUS="$(curl --silent --show-error --output /dev/null --max-redirs 0 --write-out '%{http_code}' "https://radar.pkubelka.cz/calendar/${FEED}.ics")"
            if [ "$STATUS" != "404" ]; then
              echo "Expected ${FEED} feed without its calendar token to reach Release Radar and return 404; got HTTP ${STATUS}" >&2
              exit 1
            fi
          done
